<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoring Concepts Visualizer</title>
<style>
@font-face { font-family: "Jost"; font-weight: 400; font-style: normal; font-display: block; src: url("fonts/jost-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Jost"; font-weight: 800; font-style: normal; font-display: block; src: url("fonts/jost-latin-800-normal.woff2") format("woff2"); }

/* Layout idea: a sidebar of demos and one large stage per demo, built to sit behind Kyle on camera at 1080p. Single dark theme on purpose. Color meanings never change: pressure coral, air velocity cyan, direct sound white, reflections amber, panels green. */
:root {
  --bg: #000000;
  --panel: #111111;
  --line: #2b2b2b;
  --ink: #ffffff;
  --muted: #a8a8a8;
  --accent: #00FF88;
  --pressure: #ff7a6b;
  --velocity: #4cc9f0;
  --good: #00FF88;
  --font-display: "Futura PT", Futura, Jost, "Century Gothic", sans-serif;
  --font-body: "Futura PT", Futura, Jost, "Century Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); display: grid; grid-template-columns: 250px 1fr; }
nav { border-right: 1px solid var(--line); background: var(--panel); padding: 16px 12px; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
nav .brand { font-family: var(--font-display); font-weight: 800; font-size: 22px; padding: 0 8px 6px; }
nav .brand small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 13px; color: var(--muted); }
nav a { display: grid; grid-template-columns: 22px 1fr; color: var(--muted); text-decoration: none; padding: 8px 10px; border-radius: 7px; font-weight: 400; font-size: 15px; line-height: 1.25; }
nav a .n { color: #747474; font-variant-numeric: tabular-nums; }
nav a:hover { color: var(--ink); background: #2b2b2b; }
nav a[aria-current="page"], nav a[aria-current="page"] .n { color: #000000; background: var(--accent); }
nav .foot { margin-top: auto; color: var(--muted); font-size: 12.5px; padding: 8px; line-height: 1.45; }
main { overflow: hidden; height: 100vh; padding: 16px 22px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
main > * { flex: 0 0 auto; }
main > .stage, main > .card.grow { flex: 1 1 0; min-height: 0; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 3.2vw, 50px); margin: 0; text-wrap: balance; line-height: 1.05; }
.lede { color: #c9c9c9; font-size: clamp(16px, 1.05vw, 19px); max-width: 78ch; margin: 0; line-height: 1.45; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.ctl { display: flex; flex-direction: column; gap: 5px; min-width: 170px; }
.ctl label, .ctl .lab { font-size: 13.5px; color: var(--muted); font-weight: 400; }
.ctl output { color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }
input[type=range] { width: 220px; accent-color: var(--accent); }
select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 14px; max-width: 300px; }
.btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 6px 11px; border-radius: 7px; cursor: pointer; font: inherit; font-weight: 400; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stage { display: grid; gap: 12px; grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr); }
.stage.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.card h2 { font-family: var(--font-display); font-weight: 400; font-size: 16px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 2px 2px 6px; }
canvas { display: block; width: 100%; flex: 1 1 0; min-height: 0; cursor: default; }
canvas.short { flex: 0 0 auto; height: clamp(140px, 19vh, 240px); }
canvas.click { cursor: pointer; }
.readout { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 14px; min-width: 150px; }
.stat .k { color: var(--muted); font-size: 13.5px; font-weight: 400; }
.stat .v { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 3vh, 32px); font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .v small { font-size: 16px; color: var(--muted); font-family: var(--font-body); font-weight: 400; }
/* Readouts whose text changes length get a fixed width (sized for the longest possible text) so the layout never shifts */
.fixed-stats .stat { width: 470px; max-width: 100%; }
.fixed-stats .stat .v { white-space: nowrap; }
.src { color: var(--muted); font-size: 13px; margin: 0; }
.src b { color: #c9c9c9; }
.note { color: var(--muted); font-size: 13.5px; line-height: 1.5; max-width: 110ch; margin: 0; }
.note b { color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 15px; color: #c9c9c9; margin: 0 2px 6px; }
.legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.legend i.dash { background: repeating-linear-gradient(90deg, currentColor 0 5px, transparent 5px 9px) !important; height: 3px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
.checks label { display: flex; align-items: center; gap: 6px; color: var(--ink); }
.checks .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
body.present nav { display: none; }
body.present { grid-template-columns: 1fr; }
@media (max-width: 900px) { body { display: block; height: auto; } html { height: auto; } nav { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); } nav .foot { display: none; } .stage.two { grid-template-columns: 1fr; } main { overflow: visible; height: auto; } main > .stage, main > .card.grow { flex: none; } .stage { grid-template-rows: auto; } .stage > .card { min-height: 0; } canvas { flex: none; height: 380px; } canvas.short { height: 220px; } }
@media (max-height: 820px) and (min-width: 901px) { main { gap: 7px; padding: 10px 16px 8px; } h1 { font-size: 30px; } .controls { padding: 7px 10px; gap: 6px 16px; } .ctl { gap: 3px; } .stat { padding: 4px 10px; } .stat .v { font-size: 22px; } .stat .k { font-size: 12px; } .card { padding: 6px 10px; } .card h2 { font-size: 14px; margin-bottom: 3px; } .legend { font-size: 13px; margin-bottom: 3px; } .src { font-size: 11.5px; } canvas.short { height: 110px; } .btn { padding: 4px 9px; font-size: 13px; } input[type=range] { width: 150px; } .ctl { min-width: 120px; } body { grid-template-columns: 210px 1fr; } nav a { font-size: 13.5px; padding: 6px 8px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
html.embedded, html.embedded body { height: auto; }
html.embedded body { height: var(--emb-h, 720px); }
html.embedded main { height: var(--emb-h, 720px); }
html.embedded nav { height: var(--emb-h, 720px); }
@media (max-width: 900px) { html.embedded body, html.embedded main, html.embedded nav { height: auto; } }
</style>
<script>
/* Embedded mode (e.g. a Circle page). Opened directly, nothing here runs and the page fills the window as it does for filming.
   Inside an iframe the page cannot size itself to the window, because the parent sizes the window to the page. So the height
   comes from the width instead, and the page reports its height to the parent so the iframe grows to fit with no inner scrollbar. */
try {
  if (window.self !== window.top) {
    document.documentElement.classList.add("embedded");
    var __mvSize = function () {
      var fs = !!document.fullscreenElement;
      var h = fs ? window.innerHeight : Math.round(Math.min(960, Math.max(640, window.innerWidth * 0.62)));
      document.documentElement.style.setProperty("--emb-h", h + "px");
    };
    __mvSize();
    var __mvPost = function () {
      if (document.fullscreenElement) return;
      var h = Math.ceil(document.body ? document.body.getBoundingClientRect().height : 0);
      if (!h || h < 200) return;
      try { window.parent.postMessage({ type: "mv:height", height: h }, "*"); } catch (e) {}
    };
    window.addEventListener("resize", function () { __mvSize(); __mvPost(); });
    document.addEventListener("fullscreenchange", function () { __mvSize(); setTimeout(__mvPost, 120); });
    window.addEventListener("load", function () {
      __mvPost();
      try { new ResizeObserver(__mvPost).observe(document.body); } catch (e) {}
      setInterval(__mvPost, 1000);
    });
  }
} catch (e) {}
</script>
</head>
<body>
<nav aria-label="Demos" id="nav">
  <div class="brand">Monitoring Concepts<small>Audio University visual aids</small></div>
  <div class="foot">Number keys <b>1–9</b> jump between demos. <b>F</b> for fullscreen. <b>P</b> hides this menu.</div>
</nav>
<main id="main"></main>
<script>
"use strict";
const C = 343, FT = 0.3048, IN = 0.0254;
const BANDS = [125, 250, 500, 1000, 2000, 4000];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = {};
function loadCols() { ["--ink","--muted","--line","--accent","--pressure","--velocity","--good","--panel","--bg"].forEach(k => COL[k.slice(2)] = css(k)); }
const FONT = '400 15px "Futura PT", Futura, Jost, sans-serif', FONTB = '800 15px "Futura PT", Futura, Jost, sans-serif';

// Octave-band absorption data. Room surfaces: Sengpielaudio table. Foam and fiberglass: ASTM C423, mounted directly on a hard surface.
const MAT = {
  plaster:   { name: "Smooth plaster on brick or tile", a: [.013,.015,.02,.03,.04,.05], col: "#94a3b8" },
  drywall:   { name: "Drywall, 1/2 in on studs",        a: [.29,.10,.05,.04,.07,.09],   col: "#e5e7eb" },
  carpet:    { name: "Carpet on concrete",              a: [.02,.06,.14,.37,.60,.65],   col: "#f59e0b" },
  woodfloor: { name: "Wood floor on joists",            a: [.15,.11,.10,.07,.06,.07],   col: "#fb7185" },
  foamb1:    { name: "1 in budget wedge foam",          a: [.14,.17,.36,.47,.51,.61],   col: "#fdba74" },
  foam1:     { name: "1 in acoustic foam",              a: [.10,.13,.30,.68,.94,1.00],  col: "#f472b6" },
  foam2:     { name: "2 in acoustic foam",              a: [.11,.30,.91,1.05,.99,1.00], col: "#c084fc" },
  foam4:     { name: "4 in acoustic foam",              a: [.31,.85,1.25,1.14,1.06,1.09], col: "#818cf8" },
  oc1:       { name: "1 in rigid fiberglass",           a: [.05,.26,.63,.88,.97,.94],   col: "#bef264" },
  oc2:       { name: "2 in rigid fiberglass",           a: [.15,.71,1.14,1.16,1.02,1.00], col: "#4ade80" },
  oc3:       { name: "3 in rigid fiberglass",           a: [.34,1.09,1.25,1.15,1.05,1.00], col: "#2dd4bf" },
  oc4:       { name: "4 in rigid fiberglass",           a: [.56,1.26,1.22,1.11,1.07,.96], col: "#38bdf8" }
};
// Soft cap: lab values above 1 come from edge effects, so physics uses a value just under 1
function softCap(a) { return a <= 0.9 ? a : 0.9 + 0.09 * (1 - Math.exp(-(a - 0.9) / 0.09)); }
function alphaAt(key, f) {
  const a = MAT[key].a;
  if (f <= 125) return softCap(a[0] * Math.max(f / 125, 0.25));   // below the lowest test band, assume absorption keeps falling
  if (f >= 4000) return softCap(a[5]);
  const x = Math.log2(f / 125), i = Math.floor(x), t = x - i;
  return softCap(a[i] * (1 - t) + a[i + 1] * t);
}

// ---------- drawing helpers ----------
function prep(cv) {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * d)); cv.height = Math.max(1, Math.round(r.height * d));
  const c = cv.getContext("2d"); c.setTransform(d, 0, 0, d, 0, 0); c.font = FONT; c.textBaseline = "middle";
  return { c, w: r.width, h: r.height, cv };
}
function fmtHz(f) { return f >= 1000 ? (f / 1000).toFixed(f >= 10000 || f % 1000 === 0 ? 0 : 1) + "k" : String(Math.round(f)); }
function pill(c, text, x, y, color, align) {
  c.font = FONTB; const w = c.measureText(text).width + 14;
  let x0 = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  const cw = c.canvas.width / (c.getTransform().a || 1); x0 = Math.max(4, Math.min(x0, cw - w - 4));
  c.fillStyle = "rgba(21,23,28,.9)"; c.beginPath(); c.roundRect ? c.roundRect(x0, y - 13, w, 26, 7) : c.rect(x0, y - 13, w, 26); c.fill();
  c.fillStyle = color; c.textAlign = "left"; c.fillText(text, x0 + 7, y); c.font = FONT;
}
function freqFrame(g, f0, f1, y0, y1, yLabel, ticks, fticks) {
  const { c, w, h } = g; const L = 58, R = 16, T = 14, B = 40;
  const X = f => L + (Math.log10(f / f0) / Math.log10(f1 / f0)) * (w - L - R);
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (h - T - B);
  c.strokeStyle = COL.line; c.lineWidth = 1; c.fillStyle = COL.muted;
  const fts = (fticks || [20,30,50,100,200,300,500,1000,2000,3000,5000,10000,20000]).filter(f => f >= f0 && f <= f1);
  c.textAlign = "center";
  fts.forEach(f => { c.beginPath(); c.moveTo(X(f), T); c.lineTo(X(f), h - B); c.stroke(); c.fillText(fmtHz(f), X(f), h - B + 15); });
  c.textAlign = "right";
  (ticks || []).forEach(v => { c.beginPath(); c.moveTo(L, Y(v)); c.lineTo(w - R, Y(v)); c.stroke(); c.fillText((v > 0 ? "+" : "") + v, L - 8, Y(v)); });
  if (yLabel) { c.save(); c.translate(14, (T + h - B) / 2); c.rotate(-Math.PI / 2); c.textAlign = "center"; c.fillText(yLabel, 0, 0); c.restore(); }
  c.textAlign = "center"; c.fillText("Frequency (Hz)", (L + w - R) / 2, h - 9);
  return { X, Y, L, R, T, B, w, h, clip() { c.save(); c.beginPath(); c.rect(L, T, w - L - R, h - T - B); c.clip(); } };
}
function curve(c, fr, pts, color, width, dash) {
  c.strokeStyle = color; c.lineWidth = width || 2.5; c.lineJoin = "round"; c.setLineDash(dash || []); c.beginPath();
  pts.forEach(([f, v], i) => { const x = fr.X(f), y = fr.Y(v); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); c.setLineDash([]);
}
function logSpace(f0, f1, n) { const out = []; for (let i = 0; i < n; i++) out.push(f0 * Math.pow(f1 / f0, i / (n - 1))); return out; }
const db = x => 20 * Math.log10(Math.max(x, 1e-6));
const clampv = (v, a, b) => Math.max(a, Math.min(b, v));
function arrow(c, x1, y1, x2, y2, col, w) {
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = w || 3; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1), s = 11; c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - s * Math.cos(a - .4), y2 - s * Math.sin(a - .4)); c.lineTo(x2 - s * Math.cos(a + .4), y2 - s * Math.sin(a + .4)); c.closePath(); c.fill();
}
function speakerIcon(c, x, y, s, faceRight) {
  c.fillStyle = COL.ink; c.fillRect(x - s / 2, y - s * 0.65, s, s * 1.3);
  c.fillStyle = COL.bg; c.beginPath(); c.arc(x + (faceRight === undefined ? 0 : 0), y + s * 0.15, s * 0.3, 0, 7); c.fill();
  c.beginPath(); c.arc(x, y - s * 0.38, s * 0.12, 0, 7); c.fill();
}
function speakerTop(c, x, y, ang, s) {
  c.save(); c.translate(x, y); c.rotate(ang); const d = s * 0.8, w = s;
  c.fillStyle = COL.ink; c.fillRect(-d / 2, -w / 2, d, w);
  c.fillStyle = COL.accent; c.fillRect(d / 2 - 4, -w / 2 + 2, 4, w - 4); c.restore();
}
function personIcon(c, x, y, r) { c.fillStyle = COL.velocity; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }
function lenStr(m) { const ft = m / FT; return ft < 2 ? (m / IN).toFixed(1) + " in" : ft.toFixed(1) + " ft"; }

// Bessel J1 from its integral form
function J1(x) { const N = 120; let s = 0; for (let i = 0; i <= N; i++) { const t = Math.PI * i / N, wgt = (i === 0 || i === N) ? 1 : (i % 2 ? 4 : 2); s += wgt * Math.cos(t - x * Math.sin(t)); } return s * (Math.PI / N) / 3 / Math.PI; }

// ---------- audio for the comb filter demo ----------
const audio = { ctx: null, src: null, playing: false };
function pinkBuffer(ctx) {
  const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1;
    b0 = .99886*b0 + w*.0555179; b1 = .99332*b1 + w*.0750759; b2 = .96900*b2 + w*.1538520; b3 = .86650*b3 + w*.3104856; b4 = .55000*b4 + w*.5329522; b5 = -.7616*b5 - w*.0168980;
    d[i] = (b0+b1+b2+b3+b4+b5+b6 + w*.5362) * .11; b6 = w * .115926; }
  return buf;
}
function buildIR(ctx, delaySec, gainFn, withReflection) {
  const sr = ctx.sampleRate, N = 512, half = N / 2, dS = Math.round(delaySec * sr);
  const ir = ctx.createBuffer(1, half + dS + N + 8, sr), d = ir.getChannelData(0);
  d[half] = 1;
  if (withReflection) {
    const K = N / 2, M = []; for (let k = 0; k <= K; k++) M.push(gainFn(Math.max(k * sr / N, 20)));
    for (let n = 0; n < N; n++) { const m = n - half; let s = M[0];
      for (let k = 1; k < K; k++) s += 2 * M[k] * Math.cos(2 * Math.PI * k * m / N);
      s += M[K] * Math.cos(Math.PI * m);
      d[dS + n] += (s / N) * (0.5 - 0.5 * Math.cos(2 * Math.PI * n / (N - 1))); }
  }
  return ir;
}
let pinkCache = null;
function audioStart(delaySec, gainFn, withRefl) {
  try {
    if (!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    audio.ctx.resume(); audioStop();
    const ctx = audio.ctx; if (!pinkCache) pinkCache = pinkBuffer(ctx);
    audio.src = ctx.createBufferSource(); audio.src.buffer = pinkCache; audio.src.loop = true;
    const conv = ctx.createConvolver(); conv.normalize = false; conv.buffer = buildIR(ctx, delaySec, gainFn, withRefl);
    const g = ctx.createGain(); g.gain.value = 0.22;
    audio.src.connect(conv).connect(g).connect(ctx.destination); audio.src.start(); audio.playing = true;
  } catch (e) { audio.playing = false; }
}
function audioStop() { try { if (audio.src) audio.src.stop(); } catch (e) {} audio.src = null; audio.playing = false; }

// ---------- UI helpers ----------
function slider(id, label, min, max, step, val, fmt) {
  return `<div class="ctl"><label for="${id}">${label} <output id="${id}-o"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-fmt="${fmt || ""}"></div>`;
}
function selectBox(id, label, opts, val) {
  return `<div class="ctl"><label for="${id}">${label}</label><select id="${id}">${opts.map(([v, t]) => `<option value="${v}"${v === val ? " selected" : ""}>${t}</option>`).join("")}</select></div>`;
}
function stat(id, k) { return `<div class="stat"><div class="k">${k}</div><div class="v" id="${id}">–</div></div>`; }
const $ = id => document.getElementById(id);
const num = id => parseFloat($(id).value);
function fmtOut(v, f) { return f === "ft" ? v.toFixed(1) + " ft (" + (v * FT).toFixed(2) + " m)" : f === "in" ? v + " in" : f === "loghz" ? fmtHz(Math.round(Math.pow(10, v))) + " Hz" : f === "pct" ? Math.round(v * 100) + "%" : f === "deg" ? v + "°" : f === "sqft" ? v + " sq ft" : f === "panels" ? v + (v === 1 ? " panel" : " panels") : String(v); }
let measureCtx = null;
function syncOutputs(root) {
  root.querySelectorAll("input[type=range]").forEach(r => {
    const o = $(r.id + "-o"); if (!o) return; const v = parseFloat(r.value), f = r.dataset.fmt;
    o.textContent = fmtOut(v, f);
    // Reserve room for the widest value the slider can show, so the controls never rewrap while it moves
    if (!o.dataset.mw) {
      measureCtx = measureCtx || document.createElement("canvas").getContext("2d");
      const cs = getComputedStyle(o); measureCtx.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      const lo = parseFloat(r.min), hi = parseFloat(r.max), st = parseFloat(r.step) || (hi - lo) / 200;
      let w = 0; for (let x = lo; x <= hi + 1e-9; x += Math.max(st, (hi - lo) / 400)) w = Math.max(w, measureCtx.measureText(fmtOut(+x.toFixed(4), f)).width);
      w = Math.max(w, measureCtx.measureText(fmtOut(hi, f)).width);
      o.style.display = "inline-block"; o.style.minWidth = (w / parseFloat(cs.fontSize) + 0.1).toFixed(2) + "em"; o.dataset.mw = "1";
    }
  });
}

const DEMOS = [];

// ===== 1. Comb filtering =====
DEMOS.push({
  id: "comb", title: "Reflections and comb filtering",

// ===== 2. Pointing the speakers =====
// Simplified two-way monitor: 6.5 in woofer, 1 in tweeter in a shallow waveguide, LR4 crossover at 2.5 kHz,
// woofer center 5.5 in below the tweeter. Each driver radiates like a flat piston.
// Checked against Klippel measurements of the JBL 305P MkII (Erin's Audio Corner): at 30 degrees the model is within about 1 to 2 dB at 10 and 15 kHz.
// Seated ear height 47 in (1.2 m), the listener ear height used by EBU Tech 3276 and ITU-R BS.1116.
const XO = 2500, AW = 0.065, AT = 0.015, DRV = 5.5, DESK = 29, EAR = 47, BOXUP = 2.5, BOXDN = 10.5, BOXD = 8;
function piston(a, f, th) { const x = 2 * Math.PI * f / C * a * Math.sin(th); return Math.abs(x) < 1e-4 ? 1 : Math.abs(2 * J1(x) / x); }
function lr4(f) { // returns [lpRe, lpIm, hpRe, hpIm] for a 4th-order Linkwitz-Riley crossover
  const w = f / XO, bRe = 1 - w * w, bIm = Math.SQRT2 * w;          // B(s) = s^2 + sqrt2 s + 1 at s = jw
  const b2Re = bRe * bRe - bIm * bIm, b2Im = 2 * bRe * bIm, den = b2Re * b2Re + b2Im * b2Im;
  const lpRe = b2Re / den, lpIm = -b2Im / den, s4 = w ** 4;           // LP = 1/B^2, HP = s^4/B^2 (s^4 = w^4)
  return [lpRe, lpIm, s4 * lpRe, s4 * lpIm];
}
function twoWay(f, th) { const [a, b, c, d] = lr4(f), pw = piston(AW, f, th), pt = piston(AT, f, th); return Math.hypot(a * pw + c * pt, b * pw + d * pt); }
let BEAM6 = null;
function beamHalf() { if (BEAM6) return BEAM6; for (let d = 1; d <= 90; d += .5) if (db(twoWay(15000, d * Math.PI / 180)) < -3) return (BEAM6 = d); return (BEAM6 = 90); }
// Side view: sum both drivers at the ear, with or without the bounce off the desk (all lengths in inches)
function sideResp(f, D, ht, tl, desk) {
  const k = 2 * Math.PI * f / C * IN, [lr, li, hr, hi] = lr4(f), fd = C / 0.76, R = Math.sqrt(1 - 0.1) * (f / fd) / Math.hypot(1, f / fd);   // hard desktop (absorption about 0.1), about 30 in deep, so it reflects less once the wavelength is longer than the desk
  let re = 0, im = 0;
  const add = (x, y, a, fRe, fIm, img) => {
    const yy = img ? 2 * DESK - y : y, vx = D - x, vy = EAR - yy, r = Math.hypot(vx, vy);
    const axY = img ? -Math.sin(tl) : Math.sin(tl), axX = Math.cos(tl), th = Math.acos(clampv((vx * axX + vy * axY) / r, -1, 1));
    const g = piston(a, f, th) / r * (img ? R : 1), ph = -k * r;
    re += g * (fRe * Math.cos(ph) - fIm * Math.sin(ph)); im += g * (fRe * Math.sin(ph) + fIm * Math.cos(ph));
  };
  // Tilting the cabinet back swings the woofer forward under the tweeter, so both stay the same distance from an ear on the axis
  const drivers = [[0, ht, AT, hr, hi], [DRV * Math.sin(tl), ht - DRV * Math.cos(tl), AW, lr, li]];
  drivers.forEach(([x, y, a, fr, fi]) => { add(x, y, a, fr, fi, false); if (desk && deskHit(D, y)) add(x, y, a, fr, fi, true); });
  return db(Math.hypot(re, im) * Math.hypot(D, EAR - ht));
}
function deskHit(D, y) { const up = y - DESK, xr = D * up / (up + EAR - DESK); return up > 0 && xr > 1 && xr < D - 18 ? xr : null; }

// Room 13 x 11 x 8.5 ft, rigid walls. Top view: x runs from the front wall (left) toward the back wall, y from the side wall (top) across the room.

  strad: { name: "One panel across the corner", n: CR_DIAG },

    c.save(); c.translate(X(0) - 18, Y(rh / 2)); c.rotate(-Math.PI / 2); c.fillText("Front wall", 0, 0); c.restore();
    c.fillText(zoom ? "Side wall" : "Side wall · 13 ft", X(rw / 2), Y(0) - 18);
    if (!zoom) { c.textAlign = "left"; c.fillText("11 ft", X(CR.L) + 12, Y(CR.W / 2)); }
    else for (let f = 1; f <= 4; f++) c.fillText(f + " ft", X(f), Y(rh) + 16);
    if (zoom) pill(c, sp.name, X(rw) - 8, Y(rh) - 20, COL.good, "right");
    else if (!m.ijk) pill(c, "Average of every mode up to 120 Hz", X(rw) - 8, Y(rh) - 20, COL.ink, "right");
    else if (this.view === "p") pill(c, "Most pressure in the corners", X(0) + 10, Y(rh) - 20, COL.pressure);
    else pill(c, "The air barely moves in the corner", X(0) + 10, Y(rh) - 20, COL.velocity);
  },
  init() {
    const group = (attr, val) => document.querySelectorAll(`[${attr}]`).forEach(b => b.setAttribute("aria-pressed", String(b.getAttribute(attr) === val)));
    const setM = k => { this.mode = k; group("data-crm", k); this.draw(); };
    const setV = k => { this.view = k; group("data-crv", k); this.draw(); };
    const setS = k => { this.spot = k; group("data-crs", k); this.draw(); };
    document.querySelectorAll("[data-crm]").forEach(b => b.onclick = () => setM(b.dataset.crm));
    document.querySelectorAll("[data-crv]").forEach(b => b.onclick = () => setV(b.dataset.crv));
    document.querySelectorAll("[data-crs]").forEach(b => b.onclick = () => setS(b.dataset.crs));
    const bt = $("cr-anim");
    bt.onclick = () => { const on = bt.getAttribute("aria-pressed") !== "true"; bt.setAttribute("aria-pressed", String(on)); bt.textContent = on ? "Moving air on" : "Moving air off"; this.draw(); };
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { bt.setAttribute("aria-pressed", "false"); bt.textContent = "Moving air off"; }
    this.mode = "len"; this.view = "p"; this.maps = {}; this.dots = null;
    group("data-crv", "p"); group("data-crm", "len"); setS("flat");
    const loop = t => { if (current !== this) return; if (bt.getAttribute("aria-pressed") === "true") this.draw(t / 1000); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
});

// ---------- router ----------
const nav = $("nav"), mainEl = $("main"); let current = null;
// Show order = the order the video discusses them
const ORDER = ["aim", "sbir", "modes", "driving", "comb", "quarter", "absorb", "decay", "corner"];
DEMOS.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));
DEMOS.forEach((d, i) => { const a = document.createElement("a"); a.href = "#" + d.id; a.innerHTML = `<span class="n">${i + 1}</span><span>${d.title}</span>`; a.dataset.id = d.id; nav.insertBefore(a, nav.querySelector(".foot")); });
function show() {
  const id = (location.hash || "").slice(1), d = DEMOS.find(x => x.id === id) || DEMOS[0];
  if (current && current !== d) audioStop();
  current = d; loadCols();
  nav.querySelectorAll("a").forEach(a => { if (a.dataset.id === d.id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  mainEl.innerHTML = `<h1>${d.title}</h1>` + d.html() + `<p class="src"><b>${d.srcLabel || "Sources"}:</b> ${d.src}</p>`;
  syncOutputs(mainEl);
  mainEl.querySelectorAll("input[type=range], select").forEach(el => el.addEventListener("input", () => { syncOutputs(mainEl); d.draw(); }));
  if (d.init) d.init();
  d.draw();
}
window.addEventListener("hashchange", show);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => current && current.draw(), 80); });
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select")) return;
  const k = e.key.toLowerCase();
  if (k === "p") { document.body.classList.toggle("present"); setTimeout(() => current.draw(), 30); }
  else if (k === "f") { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (err) {} }
  else if (k === "escape") { document.body.classList.remove("present"); setTimeout(() => current.draw(), 30); }
  else if (/^[1-9]$/.test(k)) location.hash = DEMOS[+k - 1].id;
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => current && current.draw());
show();
</script>
