<!--
  CIRCLE EMBED: paste into the Custom HTML block on the members-only Monitoring Visualizer page.
  Same pattern as the Troubleshooting Lab page:
    - The wrapper breaks out of Circle's content column to the full browser width (100vw).
    - The iframe is 88vh tall, so the Circle header stays visible above it. The visualizer
      fills whatever height it is given, so every demo fits on one screen with no page scroll.
    - Below 900 px wide (phones) the demos stack and scroll inside the frame.
    - allow="fullscreen" lets members press F to fill the screen.
  On every update to index.html, bump ?v=N so members load the new version instead of a cached copy.
-->
<div style="position:relative; left:50%; width:100vw; margin-left:-50vw; overflow-x:hidden;">
  <iframe src="https://audiouniversityonline-sketch.github.io/monitoring-visualizer/?v=2"
    style="width:100%; height:88vh; border:0;"
    allow="fullscreen" allowfullscreen title="Monitoring Concepts Visualizer"></iframe>
</div>
