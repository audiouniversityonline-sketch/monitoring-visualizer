<!--
  CIRCLE EMBED: the Custom HTML block on the members-only Monitoring Visualizer page.
    - Width 100% of Circle's content area. Circle pages already run the content area
      edge to edge beside the left icon rail, so no full-bleed trick is needed. (The
      100vw trick centers on the whole window, which pushes 30 px past each edge
      because of the 60 px rail.)
    - Height 88vh, so Circle's header stays visible. The visualizer fills whatever
      height it is given, so every demo fits on one screen on desktop.
    - On phones the visualizer switches to a dropdown menu and stacked panels that
      scroll inside the frame.
    - allow="fullscreen" lets members press F to fill the screen.
  On every update to index.html, bump ?v=N so members load the new version instead of a cached copy.
-->
<iframe src="https://audiouniversityonline-sketch.github.io/monitoring-visualizer/?v=3"
  style="display:block; width:100%; height:88vh; border:0;"
  allow="fullscreen" allowfullscreen title="Monitoring Concepts Visualizer"></iframe>
